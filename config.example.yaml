# GPUStack 集群连接配置
gpustack:
  base_url: "http://<GPUSTACK_HOST>:8200"
  username: "admin"
  password: "your_password_here"
  api_key: ""
  timeout: 10s

# 模型与调度配置
target:
  # 留空代表开启【全集群多模型自动同步】，自动纳管并路由 GPUStack 上的所有模型！
  # 也可以填写指定模型名称（如 "DeepSeek-V4-Flash-0731-w8a8"）开启单模型定向路由
  model_name: ""
  # 可选策略:
  # - consistent_hash: 一致性哈希，多轮对话上下文与 KV Cache 复用（根据 X-Session-ID / X-User-ID / session_id）
  # - cache_aware:     前缀缓存感知优化路由（vLLM 官方推荐）
  # - round_robin:     均匀轮询
  # - power_of_two:    P2C 算法，选取活跃连接数较低的节点
  # - random:          随机路由
  # - rendezvous_hash: 最高随机权重哈希
  policy: "consistent_hash"

# 路由器服务配置
router:
  # 运行模式:
  # - proxy: (推荐默认) 纯 Go 原生高可用网关，全集群多模型自动聚合，内置断路器与透明故障转移，零外部依赖
  # - run:   守护并管理官方 Rust 版 vllm-router 进程池，支持蓝绿无损热重载
  # - cmd:   仅查询实例并输出官方启动命令
  mode: "proxy"
  host: "0.0.0.0"
  port: 8000
  router_bin: "vllm-router"
  watch_interval: 10s
  data_parallel_size: 1
  # run 模式蓝绿无损热重载配置
  zero_downtime: true
  drain_timeout: 60s

# 熔断器 (Circuit Breaker) 与故障转移配置
# (统一生效于 mode: proxy 原生网关、mode: run 官方守护进程双层防护、以及 mode: cmd 生成命令)
circuit_breaker:
  # 是否开启断路器与透明重试故障转移
  enabled: true
  # 连续请求失败达到此阈值后立即触发熔断隔离 (State: OPEN)；对齐官方 --cb-failure-threshold
  max_failures: 3
  # 半开试探阶段所需的连续成功次数恢复健康；对齐官方 --cb-success-threshold
  success_threshold: 2
  # 熔断隔离冷却等待时长，到期后进入半开试探 (State: HALF_OPEN)；对齐官方 --cb-timeout-duration-secs
  cooldown: 10s
  # 故障统计滑动时间窗口；对齐官方 --cb-window-duration-secs
  window_duration: 60s
  # 单个请求遭遇故障/节点重启时的最大重试次数；对齐官方 --retry-max-retries
  max_retries: 2
  # 初始退避等待时长；对齐官方 --retry-initial-backoff-ms
  retry_initial_backoff: 50ms
  # 后台主动健康探测周期；对齐官方 --health-check-interval-secs 与 Supervisor 嗅探周期
  health_check_interval: 3s
  # 健康探测超时时长；对齐官方 --health-check-timeout-secs
  health_check_timeout: 5s

